name: Windows Jenkins acceptance
description: Validate a Windows Jenkins CLI executable against Credential Manager and a disposable Jenkins controller

inputs:
  cli-path:
    description: Absolute path to the Windows Jenkins CLI executable
    required: true
  expected-version:
    description: Package version expected in the CLI version output
    required: true
  expected-target:
    description: Bun target expected in the CLI version output
    required: true
  expected-credential-backend:
    description: cross-keychain backend expected for this Windows CLI build
    required: true
  tool-cache:
    description: Directory used to cache the native Jenkins WAR and plugin manager
    required: true

runs:
  using: composite
  steps:
    - name: Run Windows CLI, Credential Manager, and Jenkins acceptance
      shell: pwsh
      env:
        WINDOWS_ACCEPTANCE_CLI_PATH: ${{ inputs.cli-path }}
        WINDOWS_ACCEPTANCE_EXPECTED_VERSION: ${{ inputs.expected-version }}
        WINDOWS_ACCEPTANCE_EXPECTED_TARGET: ${{ inputs.expected-target }}
        WINDOWS_ACCEPTANCE_EXPECTED_CREDENTIAL_BACKEND: ${{ inputs.expected-credential-backend }}
        WINDOWS_ACCEPTANCE_TOOL_CACHE: ${{ inputs.tool-cache }}
        NO_COLOR: "1"
        JENKINS_ANALYTICS_DISABLED: "true"
        JENKINS_ERROR_REPORTING_DISABLED: "true"
      run: |
        $ErrorActionPreference = "Stop"
        if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
          $PSNativeCommandUseErrorActionPreference = $false
        }

        foreach ($requiredInput in @{
            "cli-path" = $env:WINDOWS_ACCEPTANCE_CLI_PATH
            "expected-version" = $env:WINDOWS_ACCEPTANCE_EXPECTED_VERSION
            "expected-target" = $env:WINDOWS_ACCEPTANCE_EXPECTED_TARGET
            "expected-credential-backend" = $env:WINDOWS_ACCEPTANCE_EXPECTED_CREDENTIAL_BACKEND
            "tool-cache" = $env:WINDOWS_ACCEPTANCE_TOOL_CACHE
          }.GetEnumerator()) {
          if ([string]::IsNullOrWhiteSpace([string]$requiredInput.Value)) {
            throw "The $($requiredInput.Key) input is required."
          }
        }

        $CliPath = (Resolve-Path -LiteralPath $env:WINDOWS_ACCEPTANCE_CLI_PATH).Path
        if (-not (Test-Path -LiteralPath $CliPath -PathType Leaf)) {
          throw "The Windows Jenkins CLI executable does not exist: $CliPath"
        }

        $RunId = [guid]::NewGuid().ToString("N")
        $ManifestPath = Join-Path $env:RUNNER_TEMP "jenkins-cli-windows-$RunId.json"
        $DownloadDirectory = Join-Path $env:RUNNER_TEMP "jenkins-cli-windows-artifacts-$RunId"
        $ProfileName = "windows-acceptance-$RunId"
        $LoginMarkerPath = Join-Path $env:RUNNER_TEMP "jenkins-cli-windows-login-$RunId"
        $JenkinsProcess = $null
        $runtimeDirectory = $null
        $jenkinsStdoutPath = $null
        $jenkinsStderrPath = $null
        $acceptanceSucceeded = $false

        New-Item -ItemType Directory -Force -Path $DownloadDirectory | Out-Null

        function Wait-ForToken {
          param(
            [Parameter(Mandatory = $true)]
            [string]$Path,
            [Parameter(Mandatory = $true)]
            [Diagnostics.Process]$Process
          )

          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          while ([DateTime]::UtcNow -lt $deadline) {
            $Process.Refresh()
            if ($Process.HasExited) {
              throw "Jenkins exited during startup with code $($Process.ExitCode)."
            }
            if (Test-Path -LiteralPath $Path -PathType Leaf) {
              $token = (Get-Content -LiteralPath $Path -Raw).Trim()
              if (-not [string]::IsNullOrWhiteSpace($token)) {
                return $token
              }
            }
            Start-Sleep -Milliseconds 500
          }
          throw "Jenkins did not write the token file within 240 seconds."
        }

        function Wait-ForJenkins {
          param(
            [Parameter(Mandatory = $true)]
            [string]$Url,
            [Parameter(Mandatory = $true)]
            [string]$Token,
            [Parameter(Mandatory = $true)]
            [Diagnostics.Process]$Process
          )

          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("integration-test:$Token")
          )
          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          $lastProblem = "Jenkins has not responded yet."
          while ([DateTime]::UtcNow -lt $deadline) {
            $Process.Refresh()
            if ($Process.HasExited) {
              throw "Jenkins exited during startup with code $($Process.ExitCode)."
            }
            try {
              $identity = Invoke-RestMethod `
                -Uri "$Url/whoAmI/api/json" `
                -Headers @{ Authorization = "Basic $credentials" } `
                -TimeoutSec 10
              if ($identity.authenticated) {
                return
              }
              $lastProblem = "Jenkins did not report an authenticated identity."
            } catch {
              $lastProblem = $_.Exception.Message
            }
            Start-Sleep -Milliseconds 500
          }
          throw "Jenkins did not become ready within 240 seconds. $lastProblem"
        }

        try {
          $env:JENKINS_INTEGRATION_TOOL_CACHE = $env:WINDOWS_ACCEPTANCE_TOOL_CACHE
          & bun scripts/test-jenkins-integration.ts --prepare-native $ManifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Native Jenkins preparation failed with exit code $LASTEXITCODE."
          }

          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
          if ($Manifest.schemaVersion -ne 1) {
            throw "Unsupported native Jenkins manifest version."
          }
          $runtimeDirectory = [string]$Manifest.runtimeDir
          $jenkinsStdoutPath = Join-Path $runtimeDirectory "jenkins.stdout.log"
          $jenkinsStderrPath = Join-Path $runtimeDirectory "jenkins.stderr.log"

          $previousLaunchEnvironment = @{}
          foreach ($property in $Manifest.launch.env.PSObject.Properties) {
            $previousLaunchEnvironment[$property.Name] = [Environment]::GetEnvironmentVariable(
              $property.Name,
              "Process"
            )
            [Environment]::SetEnvironmentVariable(
              $property.Name,
              [string]$property.Value,
              "Process"
            )
          }

          try {
            $JenkinsProcess = Start-Process `
              -FilePath ([string]$Manifest.launch.executable) `
              -ArgumentList @($Manifest.launch.args) `
              -WorkingDirectory ([string]$Manifest.launch.cwd) `
              -RedirectStandardOutput $jenkinsStdoutPath `
              -RedirectStandardError $jenkinsStderrPath `
              -PassThru
          } finally {
            foreach ($name in $previousLaunchEnvironment.Keys) {
              [Environment]::SetEnvironmentVariable(
                $name,
                $previousLaunchEnvironment[$name],
                "Process"
              )
            }
          }

          $adminToken = Wait-ForToken `
            -Path ([string]$Manifest.adminTokenFile) `
            -Process $JenkinsProcess
          Wait-ForJenkins `
            -Url ([string]$Manifest.jenkinsUrl) `
            -Token $adminToken `
            -Process $JenkinsProcess
          Write-Host "Disposable Jenkins is ready at $($Manifest.jenkinsUrl)"

          & "$env:GITHUB_ACTION_PATH/run-acceptance.ps1" `
            -CliExecutable $CliPath `
            -ExpectedVersion $env:WINDOWS_ACCEPTANCE_EXPECTED_VERSION `
            -ExpectedTarget $env:WINDOWS_ACCEPTANCE_EXPECTED_TARGET `
            -ExpectedCredentialBackend $env:WINDOWS_ACCEPTANCE_EXPECTED_CREDENTIAL_BACKEND `
            -ManifestPath $ManifestPath `
            -DownloadDirectory $DownloadDirectory `
            -ProfileName $ProfileName `
            -LoginMarkerPath $LoginMarkerPath
          $acceptanceSucceeded = $true
        } finally {
          if (-not $acceptanceSucceeded) {
            foreach ($path in @($jenkinsStdoutPath, $jenkinsStderrPath)) {
              if (
                -not [string]::IsNullOrWhiteSpace($path) -and
                (Test-Path -LiteralPath $path -PathType Leaf)
              ) {
                Write-Host "Last Jenkins output from ${path}:"
                Get-Content -LiteralPath $path -Tail 100
              }
            }
          }

          if (Test-Path -LiteralPath $LoginMarkerPath -PathType Leaf) {
            & $CliPath `
              "auth" `
              "logout" `
              "--profile" `
              $ProfileName `
              "--non-interactive"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Credential cleanup exited with $LASTEXITCODE."
            }
          }

          if ($null -ne $JenkinsProcess) {
            $JenkinsProcess.Refresh()
            if (-not $JenkinsProcess.HasExited) {
              & taskkill.exe /PID $JenkinsProcess.Id /T /F *> $null
              if ($LASTEXITCODE -ne 0) {
                Stop-Process `
                  -Id $JenkinsProcess.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
            }
            $JenkinsProcess.Dispose()
          }

          foreach ($path in @($runtimeDirectory, $DownloadDirectory)) {
            if (-not [string]::IsNullOrWhiteSpace($path)) {
              Remove-Item `
                -LiteralPath $path `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }
          foreach ($path in @($ManifestPath, $LoginMarkerPath)) {
            Remove-Item `
              -LiteralPath $path `
              -Force `
              -ErrorAction SilentlyContinue
          }
        }
