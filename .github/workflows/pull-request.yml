name: Pull Request Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fuzzy-search-docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".coderabbit.yaml"
      - ".devcontainer/**"
      - ".gitignore"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
