name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_release_inputs.outputs.tag_name }}
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SENTRY_ENVIRONMENT: github-actions
    steps:
      - name: Resolve release inputs
        id: resolve_release_inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install secure-store tooling (libsecret + keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus dbus-x11

      - name: Run tests
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          mkdir -p test-artifacts

          # Run inside a D-Bus session with an unlocked gnome-keyring so the
          # secure-store integration tests (secret-tool) actually execute on
          # Linux instead of being skipped.
          dbus-run-session -- bash -c '
            set -o pipefail
            echo -n "" | gnome-keyring-daemon --unlock >/dev/null 2>&1 || true

            set +e
            bun test --only-failures 2>&1 | tee test-artifacts/bun-test.log
            TEST_EXIT=${PIPESTATUS[0]}
            set -e

            bun test --reporter=junit --reporter-outfile test-artifacts/bun-junit.xml >/dev/null 2>&1 || true
            exit "$TEST_EXIT"
          '

      - name: Summarize test output
        if: always()
        shell: bash
        run: |
          if [ -f test-artifacts/bun-test.log ]; then
            {
              echo "## Bun test output (failures only)"
              echo ""
              echo '```text'
              sed -n '1,240p' test-artifacts/bun-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-artifacts
          path: test-artifacts
          if-no-files-found: ignore

      - name: Build & package release
        run: bun scripts/build.ts --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: true
          files: |
            dist/jenkins-cli-linux-x64
            dist/jenkins-cli-linux-x64-musl
            dist/jenkins-cli-linux-arm64
            dist/jenkins-cli-linux-arm64-musl
            dist/jenkins-cli-darwin-x64
            dist/jenkins-cli-darwin-arm64
            dist/jenkins-cli-windows-x64.exe
            dist/jenkins-cli-linux-x64.tar.gz
            dist/jenkins-cli-linux-arm64.tar.gz
            dist/jenkins-cli-darwin-x64.tar.gz
            dist/jenkins-cli-darwin-arm64.tar.gz
            dist/jenkins-cli
            dist/homebrew-jenkins-cli.rb
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        id: sync_tap
        shell: bash
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/jatinbansal1998/homebrew-tap.git" \
            tap-repo

          mkdir -p tap-repo/Formula
          cp dist/homebrew-jenkins-cli.rb tap-repo/Formula/jenkins-cli.rb

          cd tap-repo
          git add Formula/jenkins-cli.rb
          if git diff --cached --quiet -- Formula/jenkins-cli.rb; then
            echo "No formula changes; skipping."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "jenkins-cli ${TAG_NAME}"
          git push origin HEAD:main

      - name: Summarize tap sync
        if: always()
        shell: bash
        env:
          TAP_SYNC_OUTCOME: ${{ steps.sync_tap.outcome }}
        run: |
          {
            echo "## Homebrew tap sync"
            echo ""
            if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
              echo "Skipped: \`HOMEBREW_TAP_TOKEN\` is not set."
            elif [ "$TAP_SYNC_OUTCOME" = "success" ]; then
              echo "Success: \`Formula/jenkins-cli.rb\` synced to \`jatinbansal1998/homebrew-tap\`."
            elif [ "$TAP_SYNC_OUTCOME" = "skipped" ]; then
              echo "Skipped by workflow condition."
            else
              echo "Failed: tap sync step outcome was \`$TAP_SYNC_OUTCOME\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate-release-assets:
    name: Validate release asset (${{ matrix.os }})
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      JENKINS_INTEGRATION_TOOL_CACHE: ${{ runner.temp }}/jenkins-cli-integration-tools
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.release.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java for native Jenkins
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Cache native Jenkins tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/jenkins-cli-integration-tools
          key: jenkins-native-release-${{ runner.os }}-${{ runner.arch }}-2.568.1-2.15.0-${{ hashFiles('tests/integration/jenkins/plugins.txt') }}

      - name: Expose Git shell to Jenkins on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles "Git\bin"
          if (-not (Test-Path (Join-Path $gitBin "sh.exe"))) {
            throw "Git for Windows sh.exe was not found at $gitBin."
          }
          $gitBin >> $env:GITHUB_PATH

      - name: Select release asset for runner
        shell: pwsh
        run: |
          switch ($env:RUNNER_OS) {
            "Linux" {
              if ($env:RUNNER_ARCH -ne "X64") {
                throw "The Linux release validation requires an x64 runner, got $env:RUNNER_ARCH."
              }
              $assetName = "jenkins-cli-linux-x64"
              $expectedTarget = "bun-linux-x64"
            }
            "macOS" {
              switch ($env:RUNNER_ARCH) {
                "X64" {
                  $assetName = "jenkins-cli-darwin-x64"
                  $expectedTarget = "bun-darwin-x64"
                }
                "ARM64" {
                  $assetName = "jenkins-cli-darwin-arm64"
                  $expectedTarget = "bun-darwin-arm64"
                }
                default {
                  throw "No macOS release asset is published for runner architecture $env:RUNNER_ARCH."
                }
              }
            }
            "Windows" {
              if ($env:RUNNER_ARCH -ne "X64") {
                throw "The Windows release validation requires an x64 runner, got $env:RUNNER_ARCH."
              }
              $assetName = "jenkins-cli-windows-x64.exe"
              $expectedTarget = "bun-windows-x64"
            }
            default {
              throw "Unsupported release validation runner OS: $env:RUNNER_OS."
            }
          }

          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV
          "EXPECTED_TARGET=$expectedTarget" >> $env:GITHUB_ENV

      - name: Download and verify exact release asset
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null

          gh release download $env:TAG_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:ASSET_NAME `
            --pattern "checksums.txt" `
            --dir $assetDirectory `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download $env:ASSET_NAME and checksums.txt from release $env:TAG_NAME."
          }

          $cliPath = Join-Path $assetDirectory $env:ASSET_NAME
          $checksumPath = Join-Path $assetDirectory "checksums.txt"
          $checksumPattern = "^(?<hash>[0-9a-fA-F]{64})  " + [regex]::Escape($env:ASSET_NAME) + "$"
          $checksumMatches = @(Get-Content $checksumPath | Where-Object { $_ -match $checksumPattern })
          if ($checksumMatches.Count -ne 1) {
            throw "Expected exactly one checksum entry for $env:ASSET_NAME, found $($checksumMatches.Count)."
          }

          $null = $checksumMatches[0] -match $checksumPattern
          $expectedChecksum = $Matches.hash.ToLowerInvariant()
          $actualChecksum = (Get-FileHash -Algorithm SHA256 -Path $cliPath).Hash.ToLowerInvariant()
          if ($actualChecksum -cne $expectedChecksum) {
            throw "SHA-256 mismatch for $env:ASSET_NAME. Expected $expectedChecksum, got $actualChecksum."
          }

          if ($env:RUNNER_OS -ne "Windows") {
            chmod +x $cliPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to make $env:ASSET_NAME executable."
            }
          }

          $versionOutput = (& $cliPath --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "$env:ASSET_NAME --version failed with exit code $LASTEXITCODE.`n$versionOutput"
          }
          Write-Host $versionOutput

          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $versionOutput.Contains($expectedVersion)) {
            throw "Version output did not contain package version $expectedVersion."
          }
          if (-not $versionOutput.Contains($env:EXPECTED_TARGET)) {
            throw "Version output did not contain build target $env:EXPECTED_TARGET."
          }

          & $cliPath --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "$env:ASSET_NAME --help failed with exit code $LASTEXITCODE."
          }

          "JENKINS_INTEGRATION_CLI_PATH=$([IO.Path]::GetFullPath($cliPath))" >> $env:GITHUB_ENV

      - name: Run downloaded asset against native Jenkins
        run: bun run test:integration:jenkins --native
