name: Post-merge Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "fuzzy-search-docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".coderabbit.yaml"
      - ".devcontainer/**"
      - ".gitignore"

concurrency:
  group: post-merge-main

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
