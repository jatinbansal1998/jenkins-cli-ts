name: Post-merge Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".coderabbit.yaml"
      - ".devcontainer/**"
      - ".gitignore"

concurrency:
  group: post-merge-main
  # Each main commit contains every earlier one, so a newer merge replaces
  # the running check instead of queueing behind it.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Release tags already test, build, and validate binaries against Jenkins.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    uses: ./.github/workflows/ci.yml
