name: Post-merge Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - "docs/**"
      - "fuzzy-search-docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".coderabbit.yaml"
      - ".devcontainer/**"
      - ".gitignore"

concurrency:
  group: post-merge-main

permissions:
  contents: read

env:
  SENTRY_ENVIRONMENT: github-actions

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install secure-store tooling (libsecret + keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus dbus-x11

      - name: Configure unlocked test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TEST_KEYCHAIN="$RUNNER_TEMP/jenkins-cli-ci.keychain-db"
          security create-keychain -p "jenkins-cli-ci" "$TEST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TEST_KEYCHAIN"
          security unlock-keychain -p "jenkins-cli-ci" "$TEST_KEYCHAIN"
          security list-keychains -d user -s "$TEST_KEYCHAIN"
          security default-keychain -d user -s "$TEST_KEYCHAIN"
          # Each isolated test HOME configures this as its default keychain.
          echo "JENKINS_CLI_TEST_KEYCHAIN=$TEST_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and install CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          mkdir -p "$RUNNER_TEMP/jenkins-cli-bin"
          cp dist/jenkins-cli "$RUNNER_TEMP/jenkins-cli-bin/jenkins-cli"
          chmod +x "$RUNNER_TEMP/jenkins-cli-bin/jenkins-cli"
          echo "$RUNNER_TEMP/jenkins-cli-bin" >> "$GITHUB_PATH"

      - name: Build and install CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run build
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\jenkins-cli-bin" | Out-Null
          Copy-Item "dist\jenkins-cli.exe" "$env:RUNNER_TEMP\jenkins-cli-bin\jenkins-cli.exe"
          "$env:RUNNER_TEMP\jenkins-cli-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate installed CLI version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          INSTALLED_VERSION="$(jenkins-cli --version)"
          echo "$INSTALLED_VERSION"
          grep -F "$EXPECTED_VERSION" <<< "$INSTALLED_VERSION"
          case "$RUNNER_OS" in
            Linux) EXPECTED_TARGET="bun-linux-" ;;
            macOS) EXPECTED_TARGET="bun-darwin-" ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          grep -F "$EXPECTED_TARGET" <<< "$INSTALLED_VERSION"

      - name: Validate installed CLI version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = bun -e 'console.log((await Bun.file("package.json").json()).version)'
          $installedCli = (Get-Command jenkins-cli -ErrorAction Stop).Path
          $binaryText = [Text.Encoding]::Latin1.GetString(
            [IO.File]::ReadAllBytes($installedCli)
          )
          foreach ($expectedIdentity in @($expectedVersion, "bun-win32-x64")) {
            if (-not $binaryText.Contains($expectedIdentity)) {
              throw "Installed CLI does not contain expected identity '$expectedIdentity'."
            }
          }
          $binaryText = $null

          jenkins-cli --version
          if ($LASTEXITCODE -ne 0) {
            throw "Installed CLI --version failed with exit code $LASTEXITCODE."
          }
          jenkins-cli --help
          if ($LASTEXITCODE -ne 0) {
            throw "Installed CLI --help failed with exit code $LASTEXITCODE."
          }

      - name: Run tests (capture failures)
        if: runner.os == 'Linux'
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          mkdir -p test-artifacts

          # Run inside a D-Bus session with an unlocked gnome-keyring so the
          # secure-store integration tests (secret-tool) actually execute on
          # Linux instead of being skipped.
          dbus-run-session -- bash -c '
            set -o pipefail
            echo -n "" | gnome-keyring-daemon --unlock >/dev/null 2>&1 || true

            set +e
            bun test --only-failures 2>&1 | tee test-artifacts/bun-test.log
            TEST_EXIT=${PIPESTATUS[0]}
            set -e

            bun test --reporter=junit --reporter-outfile test-artifacts/bun-junit.xml >/dev/null 2>&1 || true
            exit "$TEST_EXIT"
          '

      - name: Run tests with macOS Keychain (capture failures)
        if: runner.os == 'macOS'
        shell: bash
        env:
          NO_COLOR: "1"
          REQUIRE_KEYCHAIN_INTEGRATION: "1"
        run: |
          set -o pipefail
          mkdir -p test-artifacts

          set +e
          bun test --only-failures 2>&1 | tee test-artifacts/bun-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          bun test --reporter=junit --reporter-outfile test-artifacts/bun-junit.xml >/dev/null 2>&1 || true
          exit "$TEST_EXIT"

      - name: Run tests with Windows Credential Manager (capture failures)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NO_COLOR: "1"
          REQUIRE_KEYCHAIN_INTEGRATION: "1"
        run: |
          New-Item -ItemType Directory -Force -Path test-artifacts | Out-Null

          bun test `
            --only-failures `
            --timeout 10000 `
            --path-ignore-patterns="**/compiled-cli.test.ts" 2>&1 |
            Tee-Object -FilePath test-artifacts\bun-test.log
          $testExit = $LASTEXITCODE

          bun test `
            --timeout 10000 `
            --path-ignore-patterns="**/compiled-cli.test.ts" `
            --reporter=junit `
            --reporter-outfile test-artifacts\bun-junit.xml *> $null
          exit $testExit

      - name: Summarize test output
        if: always()
        shell: bash
        run: |
          if [ -f test-artifacts/bun-test.log ]; then
            {
              echo "## Bun test output (failures only)"
              echo ""
              echo '```text'
              sed -n '1,240p' test-artifacts/bun-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-artifacts-${{ matrix.os }}
          path: test-artifacts
          if-no-files-found: ignore

  jenkins-integration:
    name: Jenkins integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-script: test:mutation:jenkins
          - os: macos-latest
            test-script: test:integration:jenkins
          - os: windows-latest
            test-script: test:integration:jenkins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java for native Jenkins
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Cache native Jenkins tools
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/jenkins-cli-integration-tools
          key: jenkins-native-${{ runner.os }}-2.568.1-2.15.0-${{ hashFiles('tests/integration/jenkins/plugins.txt') }}

      - name: Install Linux keyring tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus dbus-x11 util-linux

      - name: Configure unlocked macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TEST_KEYCHAIN="$RUNNER_TEMP/jenkins-cli-integration.keychain-db"
          security create-keychain -p "jenkins-cli-ci" "$TEST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TEST_KEYCHAIN"
          security unlock-keychain -p "jenkins-cli-ci" "$TEST_KEYCHAIN"
          security list-keychains -d user -s "$TEST_KEYCHAIN"
          security default-keychain -d user -s "$TEST_KEYCHAIN"
          echo "JENKINS_CLI_TEST_KEYCHAIN=$TEST_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Expose Git shell to native Jenkins on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles "Git\bin"
          if (-not (Test-Path (Join-Path $gitBin "sh.exe"))) {
            throw "Git for Windows sh.exe was not found in $gitBin"
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows CLI for real Jenkins acceptance
        id: windows_cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run build
          $cliDirectory = Join-Path $env:RUNNER_TEMP "jenkins-cli-source-acceptance"
          New-Item -ItemType Directory -Force -Path $cliDirectory | Out-Null
          $cliPath = Join-Path $cliDirectory "jenkins-cli.exe"
          Copy-Item -LiteralPath "dist\jenkins-cli.exe" -Destination $cliPath
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WINDOWS_JENKINS_CLI_PATH=$cliPath" >> $env:GITHUB_ENV
          "WINDOWS_EXPECTED_VERSION=$version" >> $env:GITHUB_ENV
          "cli_path=$cliPath" >> $env:GITHUB_OUTPUT
          "expected_version=$version" >> $env:GITHUB_OUTPUT

      - name: Run Jenkins integration tests with Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        env:
          REQUIRE_KEYCHAIN_INTEGRATION: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail

            # Create and unlock a real login collection before D-Bus activates
            # the Secret Service component.
            eval "$(printf %s "jenkins-cli-ci" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL

            # Fail before Jenkins startup if Secret Service cannot round-trip
            # a credential in this exact session.
            printf %s "keyring-probe" |
              secret-tool store --label="jenkins-cli integration probe" \
                service jenkins-cli-ci account integration-probe
            test "$(secret-tool lookup service jenkins-cli-ci account integration-probe)" = "keyring-probe"
            secret-tool clear service jenkins-cli-ci account integration-probe

            bun run "${{ matrix.test-script }}"
          '

      - name: Run Jenkins integration tests with macOS Keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          REQUIRE_KEYCHAIN_INTEGRATION: "1"
          JENKINS_INTEGRATION_TOOL_CACHE: ${{ runner.temp }}/jenkins-cli-integration-tools
        run: bun run "${{ matrix.test-script }}"

      - name: Run Jenkins integration tests on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-jenkins-acceptance
        with:
          cli-path: ${{ steps.windows_cli.outputs.cli_path }}
          expected-version: ${{ steps.windows_cli.outputs.expected_version }}
          expected-target: bun-win32-x64
          tool-cache: ${{ runner.temp }}/jenkins-cli-integration-tools
